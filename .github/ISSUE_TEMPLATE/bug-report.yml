name: "BUG 报告 / Bug report"
description: "报告可复现的异常、崩溃或行为错误 / Report a reproducible error, crash, or unexpected behavior."
title: "【BUG】 "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈。公开 Issue 可附经过脱敏的最小日志片段；请勿上传凭据、私人存档、完整本地路径或个人信息。安全漏洞请使用私密报告入口。
        Thanks for reporting a bug. You may include a minimal redacted log excerpt; do not upload credentials, private saves, complete local paths, or personal information. Use private reporting for security vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: "问题说明 / What happened?"
      description: "请说明实际发生了什么，以及你原本预期会发生什么。/ Describe the actual result and the expected result."
      placeholder: "实际结果：...\n预期结果：...\nActual result: ...\nExpected result: ..."
    validations:
      required: true
  - type: dropdown
    id: game_branch
    attributes:
      label: "是否使用分支版本游戏？/ Are you using a beta branch?"
      description: "默认选择正式/主线版；若选择“是”，请在问题说明中写明分支名称。/ The default is the live/main branch; name the branch in the description if you select Yes."
      options:
        - "否 / No (正式/主线版)"
        - "是 / Yes (分支版)"
      default: 0
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: "游戏版本 / Game version"
      description: "请填写游戏设置或日志中显示的版本号。/ Enter the version shown in the game settings or log."
      placeholder: "例如 / e.g. 0.107.0"
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: "模组版本 / Mod version"
      description: "请填写已安装的真盖塔模组版本。/ Enter the installed Shin Getter Mod version."
      value: "latest release"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "复现步骤与日志 / Steps to reproduce and logs"
      description: "请按顺序列出操作；可附相关日志片段。/ List the steps in order and add relevant log excerpts if available."
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
